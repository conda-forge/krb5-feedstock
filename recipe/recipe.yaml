context:
  version: "1.22.3"

recipe:
  name: krb5-split
  version: ${{ version }}

source:
  url: https://github.com/krb5/krb5/archive/krb5-${{ version }}-final.tar.gz
  sha256: 4b1d2f8317e17a5848c62a1af460e00cdd6e8ef0fe267f6e6d1a4bc73a0e416d
  patches:
    # see https://github.com/krb5/krb5/pull/1528
    - if: win
      then: patches/0001-fix-windows-arm64-cross-build.patch

build:
  number: 0

outputs:
  - package:
      name: krb5
    build:
      script:
        file: build_shared
      dynamic_linking:
        missing_dso_allowlist:
          - /usr/lib/libresolv.9.dylib

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - gettext
        - if: unix
          then:
            - autoconf
            - bison
            - libtool
            - make
            - pkgconf
            - python *
          else:
            - m2-base
            - perl
      host:
        - openssl
        - if: unix
          then: libedit
        - if: linux
          then: keyutils
      run_exports:
        # stable within minor revisions: https://abi-laboratory.pro/tracker/timeline/krb5/
        - ${{ pin_subpackage('krb5', upper_bound='x.x') }}
    tests:
      - package_contents:
          lib:
            - if: unix
              then: krb5
              else: krb5_64

  - package:
      name: krb5-static
    build:
      skip: win
      script:
        file: build_static
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - autoconf
        - bison
        - make
        - pkgconf
        - python ${{ python_min }}.*
        - gettext
      host:
        - libedit
        - openssl
      run:
        - ${{ pin_subpackage('krb5', exact=True) }}
    tests:
      - package_contents:
          files:
            - lib/libk5crypto.a

about:
  homepage: http://web.mit.edu/kerberos
  license: MIT
  license_file: doc/notice.rst
  summary: A network authentication protocol.
  repository: https://github.com/krb5/krb5

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf
    - mariusvniekerk
    - wolfv
    - h-vetinari
  feedstock-name: krb5
